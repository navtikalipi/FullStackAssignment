server.port=8787

# OpenRouter config
openrouter.api-key=${OPENROUTER_API_KEY}
openrouter.model=gpt-4o-mini
openrouter.base-url=https://openrouter.ai/api/v1

# Backend integration (docker compose service names)
backend.url=http://backend:8080
backend.market-path=/market
backend.transactions-path=/transactions

# Chat config
chat.max-tokens=1500
chat.temperature=0.7

# JPA MySQL (shared with Backend)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://db:3306/stockdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.main.allow-bean-definition-overriding=true

logging.level.com.tnc.chatadvisor=DEBUG
logging.level.org.hibernate.SQL=DEBUG
